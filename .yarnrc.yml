nodeLinker: node-modules
packageExtensions:
  "@nestjs/common@*":
    peerDependenciesMeta:
      rxjs:
        optional: true
      reflect-metadata:
        optional: true
  "@nestjs/core@*":
    peerDependenciesMeta:
      rxjs:
        optional: true
      reflect-metadata:
        optional: true
  "@nestjs/axios@*":
    peerDependenciesMeta:
      "@nestjs/common":
        optional: true
  "@nestjs/swagger@*":
    peerDependenciesMeta:
      "@nestjs/common":
        optional: true
      "@nestjs/core":
        optional: true
  "@nestjs/terminus@*":
    peerDependenciesMeta:
      "@nestjs/common":
        optional: true
      "@nestjs/core":
        optional: true
  "@nestjs/typeorm@*":
    peerDependenciesMeta:
      "@nestjs/common":
        optional: true
      "@nestjs/core":
        optional: true
      reflect-metadata:
        optional: true
  "@volontariapp/bridge-nest@*":
    peerDependenciesMeta:
      "@nestjs/common":
        optional: true
  "@volontariapp/errors-nest@*":
    peerDependenciesMeta:
      "@nestjs/common":
        optional: true
      "@nestjs/core":
        optional: true
  "@volontariapp/health-check-nest@*":
    peerDependenciesMeta:
      "@nestjs/common":
        optional: true
      "@nestjs/terminus":
        optional: true
  "@volontariapp/validation-nest@*":
    peerDependenciesMeta:
      "@nestjs/common":
        optional: true
      class-validator:
        optional: true
      class-transformer:
        optional: true
